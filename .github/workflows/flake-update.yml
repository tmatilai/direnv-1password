name: Update flake.lock

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - run: nix flake update

      - run: nix develop --command make test

      # The app token makes Test run on the PR; GITHUB_TOKEN does not trigger workflows
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Committed through the API so that GitHub signs it, as main requires signed commits
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git diff --quiet flake.lock && exit 0
          branch='flake-update'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent -f sha="$GITHUB_SHA" -F force=true
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA"
          fi
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg oid "$GITHUB_SHA" \
            --rawfile lock flake.lock \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "chore: update flake.lock"},
                fileChanges: {additions: [{path: "flake.lock", contents: ($lock | @base64)}]}
              }}
            }' > "$RUNNER_TEMP/commit.json"
          gh api graphql --silent --input "$RUNNER_TEMP/commit.json"
          gh pr list --head "$branch" --json number --jq length | grep -q '^0$' || exit 0
          gh pr create --base main --head "$branch" --title "chore: update flake.lock" --body "Automated \`nix flake update\`."
